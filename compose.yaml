# Deployment for sudi.dev.
#
# Assumes a Traefik instance already running on this host, attached to an
# external network named `traefik` and resolving certificates through a
# resolver named `letsencrypt`. Adjust the two names below to match yours.
#
#   docker compose up -d --build
#
services:
  web:
    build:
      context: .
      args:
        # Build-time, not runtime — see the note in the Dockerfile. Changing
        # any of these requires a rebuild, not just a restart.
        NEXT_PUBLIC_GISCUS_REPO: ${NEXT_PUBLIC_GISCUS_REPO}
        NEXT_PUBLIC_GISCUS_REPO_ID: ${NEXT_PUBLIC_GISCUS_REPO_ID}
        NEXT_PUBLIC_GISCUS_CATEGORY: ${NEXT_PUBLIC_GISCUS_CATEGORY}
        NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${NEXT_PUBLIC_GISCUS_CATEGORY_ID}
    image: sudi-dev:latest
    restart: unless-stopped

    # Runtime secrets, read from .env on the host — never baked into the image.
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_URL: ${AUTH_URL:-https://sudi.dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      EMAIL_FROM: ${EMAIL_FROM}

    networks: [traefik]

    # No published ports: Traefik reaches the container over the shared
    # network, so nothing is exposed on the host directly.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.sudi.rule: Host(`sudi.dev`) || Host(`www.sudi.dev`)
      traefik.http.routers.sudi.entrypoints: websecure
      traefik.http.routers.sudi.tls.certresolver: letsencrypt
      traefik.http.services.sudi.loadbalancer.server.port: '3000'

      # www → apex, so one canonical hostname is indexed.
      traefik.http.routers.sudi.middlewares: sudi-www@docker
      traefik.http.middlewares.sudi-www.redirectregex.regex: ^https?://www\.sudi\.dev/(.*)
      traefik.http.middlewares.sudi-www.redirectregex.replacement: https://sudi.dev/$${1}
      traefik.http.middlewares.sudi-www.redirectregex.permanent: 'true'

    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  traefik:
    external: true
